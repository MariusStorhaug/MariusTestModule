name: Process-PSModule

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  pull_request:
    branches:
      - main
    types:
      - closed
      - opened
      - reopened
      - synchronize
      - labeled

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  statuses: write
  pages: write
  id-token: write

jobs:
  Process-PSModule:
    # SPIKE: pinned to the Process-PSModule branch that adds the 'Environment' input.
    # Environment secrets are only reachable inside the reusable workflow when the whole
    # call chain uses `secrets: inherit` AND the test jobs bind to the environment. A job
    # that calls a reusable workflow cannot set an environment, so the binding happens
    # inside Process-PSModule; the caller just inherits secrets and names the environment.
    uses: PSModule/Process-PSModule/.github/workflows/workflow.yml@spike/environment-support
    secrets: inherit
    with:
      Environment: Testing
