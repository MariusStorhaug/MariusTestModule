name: Process-PSModule

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  pull_request:
    branches:
      - main
    types:
      - closed
      - opened
      - reopened
      - synchronize
      - labeled

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  statuses: write
  pages: write
  id-token: write

jobs:
  Process-PSModule:
    # SPIKE: pinned to the Process-PSModule branch that adds the 'Environment' input.
    # Secrets and variables now come from the "Testing" GitHub Environment, not from a
    # caller-built TestData blob (a job that calls a reusable workflow cannot set an
    # environment, so it cannot read environment-scoped secrets/variables itself).
    uses: PSModule/Process-PSModule/.github/workflows/workflow.yml@spike/environment-support
    secrets:
      APIKey: ${{ secrets.APIKey }}
    with:
      Environment: Testing
