# Zensical configuration
# https://zensical.org/docs/setup/basics/
#
# Navigation state is injected centrally by the Process-PSModule Build-Site stage,
# and site_dir is resolved during Structure-Site. This file stays repo-local for
# theme and docs metadata only.
[project]
site_name = "-{{ REPO_NAME }}-"
repo_name = "-{{ REPO_OWNER }}-/-{{ REPO_NAME }}-"
repo_url = "https://github.com/-{{ REPO_OWNER }}-/-{{ REPO_NAME }}-"

[project.theme]
language = "en"
font.text = "Mona Sans"
font.code = "Source Code Pro"
logo = "Assets/icon.png"
favicon = "Assets/icon.png"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant.prefetch",
  "navigation.instant.preview",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.indexes",
  "navigation.top",
  "navigation.tracking",
  "search.share",
  "search.suggest",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
repo = "material/github"
link = "material/link-variant"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "material/link"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "light blue"
toggle.icon = "material/toggle-switch-off-outline"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "light blue"
toggle.icon = "material/toggle-switch"
toggle.name = "Switch to system preference"

[project.plugins.search]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.attr_list]

[project.markdown_extensions.admonition]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.superfences]

[project.extra.consent]
title = "Cookie consent"
description = """
    We use cookies to recognize your repeated visits and preferences, as well
    as to measure the effectiveness of our documentation and whether users
    find what they're searching for. With your consent, you're helping us to
    make our documentation better.
"""
actions = ["accept", "reject"]

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://discord.gg/jedJWCPAhD"
name = "-{{ REPO_OWNER }}- on Discord"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/-{{ REPO_OWNER }}-/"
name = "-{{ REPO_OWNER }}- on GitHub"
